<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Underground Night</title>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="loading" class="overlay">
      <div class="overlay-title">Carregando...</div>
      <div id="loading-text" class="overlay-sub">Iniciando</div>
    </div>

    <div id="error" class="overlay" style="display: none"></div>

    <div id="hud" style="display: none">
      <div id="speedo">
        <div id="rpm-bar"><div id="rpm-fill"></div></div>
        <div id="speed-row">
          <span id="speed">0</span>
          <span id="speed-unit">km/h</span>
        </div>
        <div id="gear-row">
          <span id="gear-label">MARCHA</span>
          <span id="gear">1</span>
        </div>
      </div>
      <canvas id="minimap" width="160" height="160"></canvas>
      <div id="help">W/S acelera/freia · A/D vira · ESPAÇO freio de mão · R reset · M mudo</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
